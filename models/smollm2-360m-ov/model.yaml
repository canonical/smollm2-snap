name: smollm2-360m-ov
quantization: INT8
disk-size: 371M

description: |
  SmolLM2-360M-Instruct is a compact instruction-tuned language model.
  This variant uses INT8 quantization and the OpenVINO format for efficient
  inference on Intel CPUs and GPUs.
model-card-url: https://huggingface.co/AIFunOver/SmolLM2-360M-Instruct-openvino-8bit

capabilities:
  - text

components:
  - smollm2-360m-int8-ov

environment:
  - MODEL_PATH=$SNAP_COMPONENTS/smollm2-360m-int8-ov
