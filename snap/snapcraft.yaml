name: smollm2
title: SmolLM2
summary: Local AI with SmolLM2 inference snap
description: |
  SmolLM2 is a compact large language model (LLM) developed by Hugging Face.
  It is designed for efficient natural language tasks such as text generation,
  summarization, and question answering.

  Use this snap to quickly install an optimized environment for local inference with SmolLM2.

  The snap includes the following hardware-optimized inference engines:

  * cpu: Optimized for x64 and ARM (armv8, armv9) CPUs, and RISC-V (RVA23,
    with automatic SpacemiT IME acceleration on supported boards)
  * intel-cpu: OpenVINO acceleration for Intel CPUs
  * intel-gpu: OpenVINO acceleration for supported Intel GPUs
  * nvidia-gpu: CUDA-enabled GPU acceleration

  The most suitable engine is automatically selected based on the available hardware.

  **Install:**

  `sudo snap install smollm2`

  **Run:**

  `smollm2`

  Some accelerators require extra drivers to be usable with this snap:
  https://documentation.ubuntu.com/inference-snaps/how-to/setup/drivers/

  **License:**

  The SmolLM2 model is provided by Hugging Face under the Apache 2.0 license:
  https://huggingface.co/collections/HuggingFaceTB/smollm2

  The licenses of all the bundled software can be found after installing the snap at
  `/snap/smollm2/current/usr/share/doc`.

icon: snap/gui/icon-256.png
website: https://documentation.ubuntu.com/inference-snaps
source-code: https://github.com/canonical/smollm2-snap
issues: https://github.com/canonical/inference-snaps/issues

adopt-info: version

base: core24
grade: stable
confinement: strict
compression: lzo

assumes:
  - snapd2.68 # for components support

platforms:
  amd64:
  arm64:
  riscv64:

slots:
  provider:
    interface: content
    content: inference-provider
    source:
      read:
        - $SNAP_COMMON/share/provider
plugs:
  # To allow side-loading models into server (root daemon) from user home directory
  home:
    read: all

environment:
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR
  OCL_ICD_VENDORS: $SNAP/etc/OpenCL/vendors

layout:
  /etc/OpenCL/vendors:
    bind: $SNAP/etc/OpenCL/vendors
  # Intel ICD files refer to absolute library paths.
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl
  # Under wsl the libraries are expected in /usr/lib/wsl
  /usr/lib/wsl:
    bind: $SNAP_COMMON/usr/lib/wsl

hooks:
  install:
    plugs: &install-plugs
      # For hardware detection
      - hardware-observe
      - opengl
  post-refresh:
    plugs: *install-plugs

parts:
  version:
    after: [cli]
    plugin: nil
    source: . # To regenerate the git hash on every change
    build-packages:
      - jq
      - git
    override-pull: |
      # Do nothing. This significantly reduces build time when sourcing large files.
    override-build: |
      set -eo pipefail
      cli_version=$($CRAFT_STAGE/bin/modelctl version --format=json | jq .cli --raw-output 2>/dev/null || true)
      git_hash=$(git -C "$SNAPCRAFT_PROJECT_DIR" describe --always)
      if [ -n "$cli_version" ]; then
        craftctl set version="${cli_version#v}+${git_hash}"
      else
        # modelctl for the target architecture cannot run on the build host
        # (e.g. cross-building riscv64 on amd64) - fall back to a git-derived
        # version so cross builds keep working.
        echo "::warning::modelctl not executable on build host - using git-only version"
        craftctl set version="0.0.0+${git_hash}"
      fi
  cli:
    source:
      - on amd64: https://github.com/canonical/inference-snaps/releases/download/v2.0.0-rc.1/modelctl-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps/releases/download/v2.0.0-rc.1/modelctl-linux-arm64.tar.xz
      # TODO: build and publish modelctl-linux-riscv64.tar.xz on inference-snaps
      # releases instead of shipping the tarball in-tree, once riscv64 is a
      # supported platform there.
      - on riscv64: ./modelctl-linux-riscv64.tar.xz
    plugin: dump
    override-build: |
      # For tab completion
      ln --symbolic ./modelctl bin/smollm2

      craftctl default

  # To build the CLI from source, replace the above part with the following:
  # If the source version is longer than 32 char, replace the versioning line with 'craftctl set version="dev"'
  # cli:
  #   # Repo checked out in the same project:
  #   # source: ./inference-snaps-cli
  #   # Repo from GitHub:
  #   source: https://github.com/canonical/inference-snaps-cli.git
  #   source-branch: <branch>
  #   plugin: go
  #   build-snaps:
  #     - go/1.26/stable
  #   override-build: |
  #     craftctl default

  #     # For tab completion
  #     mkdir -p $CRAFT_PART_INSTALL/bin
  #     cp completer/snap.bash $CRAFT_PART_INSTALL/bin/snap-completer.bash
  #     ln --symbolic ./modelctl $CRAFT_PART_INSTALL/bin/smollm2
      
  cli-lspci:
    plugin: nil
    stage-packages:
      - pciutils # lspci
      - on amd64:
          - clinfo # Intel GPU vRAM detection

  intel-opencl-icd:
    source: https://github.com/canonical/intel-compute-runtime-bundle.git
    source-tag: 26.22.38646.4
    plugin: make
    make-parameters:
      - BUNDLE=intel-opencl-icd
    build-packages:
      - wget

  # Used for NVIDIA vRAM and CUDA Capability detection.
  # Only the binary is included to avoid staging libraries, which should instead be provided by the host through the opengl interface.
  cli-nvidia-smi:
    plugin: nil
    build-packages:
      - on amd64:
          - nvidia-utils-580
      - on arm64:
          - nvidia-utils-580
    override-build: |
      if [ "$CRAFT_ARCH_BUILD_FOR" != "riscv64" ]; then
        mkdir -p $CRAFT_PART_INSTALL/usr/bin
        cp /usr/bin/nvidia-smi $CRAFT_PART_INSTALL/usr/bin/

        license_dir=$CRAFT_PART_INSTALL/usr/share/doc/nvidia-utils-580
        mkdir -p $license_dir
        cp /usr/share/doc/nvidia-utils-580/copyright $license_dir/
      fi

  webui:
    plugin: dump
    source: https://github.com/canonical/inference-snaps-webui/releases/download/v1.1.1/inference-snaps-webui.tar.xz
    organize:
      "*": webui/

  engines:
    source: engines
    plugin: dump
    organize:
      "*": engines/

  models:
    source: models
    plugin: dump
    organize:
      "*": models/

  runtimes:
    source: runtimes
    plugin: dump
    organize:
      "*": runtimes/
  
  scripts:
    source: scripts
    plugin: dump
    stage-packages:
      - jq
    organize:
      "server.sh": bin/
      "engine-server.sh": bin/
      "server-webui.sh": bin/

  model-weights:
    plugin: cmake # an out-of-source plugin to reduce copies on disk
    source: model-weights
    override-build:
      cp -rf --archive --link --no-dereference ${CRAFT_PART_SRC}/* ${CRAFT_PART_INSTALL}
    organize:
      "llamacpp/*": (component/llamacpp)
      "llamacpp-cuda/*": (component/llamacpp-cuda)
      "smollm2-135m-q4-k-m-gguf/*": (component/smollm2-135m-q4-k-m-gguf)
      "smollm2-360m-int8-ov/*": (component/smollm2-360m-int8-ov)
      
    prime:
      # Exclude everything not explicitly organized
      - -*

  llamacpp:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/v0.5.0/llamacpp-amd64.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/v0.5.0/llamacpp-arm64.tar.gz
      # riscv64: single artifact with runtime hardware dispatch - engages the
      # SpacemiT A100 "AI core" IME matrix instructions + TCM automatically on
      # SpacemiT boards (vendor BSP kernel), falls back to portable RVV 1.0 on
      # any other riscv64 system. Produced by the riscv64+spacemit job in
      # llama.cpp-builds.
      # TODO: switch to a canonical/llama.cpp-builds release URL once
      # https://github.com/canonical/llama.cpp-builds/pull/35 is merged and
      # a new release is tagged.
      - on riscv64: https://github.com/jpm-canonical/llama.cpp-builds/releases/download/v1.0.0%2Briscv64/llamacpp-riscv64%2Bspacemit.tar.gz
    stage-packages:
      - libgomp1
    override-build: |
      # Move license files to be included in the snap, not the component
      mkdir -p $CRAFT_PRIME/usr/share/doc/
      mv licenses $CRAFT_PRIME/usr/share/doc/llama.cpp
      craftctl default
    organize:
      "*": (component/llamacpp)
    
  llamacpp-cuda:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/v0.5.0/llamacpp-amd64+cuda12.9.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/v0.5.0/llamacpp-arm64+cuda12.9.tar.gz
      # No CUDA artifact exists for riscv64: use a placeholder source (required
      # by snapcraft) and skip the part entirely below, mirroring how
      # openvino-model-server is gated to amd64. The component is packed empty
      # on this architecture, exactly like the openvino component on arm64.
      - on riscv64: ./snap/placeholder
    stage-packages:
      - on amd64:
          - libgomp1
      - on arm64:
          - libgomp1
    override-pull: &not-riscv64 |
      if [ "$CRAFT_ARCH_BUILD_FOR" != "riscv64" ]; then
        craftctl default
      fi
    override-build: |
      if [ "$CRAFT_ARCH_BUILD_FOR" != "riscv64" ]; then
        # Move license files to be included in the snap, not the component
        mkdir -p $CRAFT_PRIME/usr/share/doc/
        mv licenses $CRAFT_PRIME/usr/share/doc/llama.cpp+cuda
        craftctl default
      fi
    override-stage: *not-riscv64
    override-prime: *not-riscv64
    organize:
      "*": (component/llamacpp-cuda)

  openvino-model-server:
    plugin: dump
    source: https://github.com/openvinotoolkit/model_server/releases/download/v2026.2.1/ovms_ubuntu24_2026.2.1_python_off.tar.gz
    stage-packages:
      - on amd64:
          - libxml2
          - libcurl4
    organize:
      "*": (component/openvino-model-server)
    override-pull: &amd64-only |
      if [ "$CRAFT_ARCH_BUILD_FOR" = "amd64" ]; then
        craftctl default
      fi
    override-build: |
      if [ "$CRAFT_ARCH_BUILD_FOR" = "amd64" ]; then
        # Move license files to be included in the snap, not the component
        license_dir=$CRAFT_PRIME/usr/share/doc/openvino-model-server
        mkdir -p $license_dir
        mv LICENSE $license_dir/
        mv thirdparty-licenses $license_dir/
        craftctl default
      fi
    override-stage: *amd64-only
    override-prime: *amd64-only

  intel-compute-runtime:
    source: https://github.com/canonical/intel-compute-runtime-bundle.git
    source-tag: 26.22.38646.4
    plugin: make
    make-parameters:
      - BUNDLE=intel-compute-runtime
    build-packages:
      - wget
    organize:
      "*": (component/openvino-model-server)

  notice:
    plugin: nil
    source: NOTICE
    source-type: file
    override-build: |
      license_dir=$CRAFT_PART_INSTALL/usr/share/doc
      mkdir -p $license_dir
      cp NOTICE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE-smollm2 $license_dir/

components:
  smollm2-135m-q4-k-m-gguf:
    type: standard
    summary: SmolLM2 135M Instruct Q4_K_M GGUF
    description: Model weights for SmolLM2 135M Instruct in GGUF format

  smollm2-360m-int8-ov:
    type: standard
    summary: SmolLM2 360M Instruct INT8 OpenVINO
    description: Model weights for SmolLM2 360M Instruct in OpenVINO INT8 format

  openvino-model-server:
    type: standard
    summary: OpenVINO Model Server
    description: OpenVINO Model Server with Intel CPU and GPU support

  llamacpp:
    type: standard
    summary: llama.cpp using default CPU instruction sets
    description: LLM inference in C/C++
  
  llamacpp-cuda:
    type: standard
    summary: llama.cpp with CUDA backend
    description: LLM inference in C/C++

apps:
  smollm2:
    command: bin/modelctl
    completer: bin/snap-completer.bash
    plugs:
      - hardware-observe
      - opengl
      - network
      - desktop # To open the webui in the browser
    environment:
      ADDITIONAL_FEATURES: chat, webui

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      - network-bind
      - hardware-observe
      - opengl
      - home

  server-webui:
    command: bin/server-webui.sh
    daemon: simple
    plugs:
      - network-bind

lint:
  ignore:
    - metadata:
      - license
      - contact
