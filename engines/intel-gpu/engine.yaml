name: intel-gpu
summary: Optimized for Intel GPUs
description: |
  This engine uses OpenVINO Model Server.
  It is optimized for Intel Xe (Alchemist), Xe2 (Battlemage), Alder Lake, Raptor Lake,
  Meteor Lake, Lunar Lake, Arrow Lake, and Panther Lake GPUs.
vendor: Canonical Ltd

devices:
  allof:
    - type: cpu
      architecture: amd64
    - type: gpu
      vram: 1G
      vendor-id: 0x8086

runtime: openvino-model-server

model:
  default: smollm2-360m-ov
  options:
    - smollm2-360m-ov
